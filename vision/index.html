  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <div class="mark" aria-hidden="true">✳</div>
          <div>
            <h1>Vison <span style="color:#9e8cff">·</span> Eternal Mind</h1>
          </div>
        </div>
        <div class="hud-status" id="hud-status"><span>NEURAL LINK</span><span id="hud-clock">--:--:--</span></div>
      </header>

      <div class="layout">
        <section class="panel">
          <div class="panel-head">
            <h2>Project connections</h2>
            <span class="hint" id="graph-summary">Updating live</span>
          </div>
          <div class="graph-wrap" id="graph-wrap"><svg id="graph" role="img" aria-label="Live project connection graph"></svg></div>
          <div class="graph-detail" id="graph-detail"><span>◈</span><span id="graph-hint">Import links and API routes</span></div>
        </section>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let selectedNode = null;
      let latestGraph = null;
      const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
      const formatSize = (bytes) => bytes < 1024 ? `${bytes} B` : bytes < 1048576
        ? `${(bytes / 1024).toFixed(1)} KB` : `${(bytes / 1048576).toFixed(1)} MB`;
      const formatUptime = (seconds) => {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        return hours ? `${hours}h ${minutes}m` : minutes ? `${minutes}m` : `${seconds}s`;
      };

      function renderGraph(nodes, edges, omitted) {
        const svg = $("graph");
        const viewportWidth = Math.max(320, Math.round($("graph-wrap").clientWidth));
        const height = Math.max(240, Math.round(svg.clientHeight));
        const rowTop = 42;
        const rowBottom = 18;
        const getFolder = (node) => {
          const firstPathPart = node.path.replaceAll("\\", "/").split("/")[0];
          return node.path.includes("/") ? firstPathPart : "root";
        };
        const folderNames = [...new Set(nodes.map(getFolder))].sort((a, b) => {
          const order = ["frontend", "backend", "root"];
          const aOrder = order.indexOf(a);
          const bOrder = order.indexOf(b);
          if (aOrder !== -1 || bOrder !== -1) {
            return (aOrder === -1 ? order.length : aOrder) - (bOrder === -1 ? order.length : bOrder);
          }
          return a.localeCompare(b);
        });
        const laneWidth = Math.max(viewportWidth / Math.max(folderNames.length, 1), 250);
        const width = laneWidth * folderNames.length;
        const cardWidth = Math.min(320, laneWidth * .78);
        const palette = ["#63e9ff", "#ad9aff", "#ffc97e", "#6de0b0", "#ff8db3", "#83aaff", "#f0a8ff"];
        const lanes = folderNames.map((name, index) => ({
          key: name,
          label: name === "root" ? "ROOT" : name.toUpperCase(),
          x: laneWidth * (index + .5),
          color: palette[index % palette.length],
        }));
        const grouped = Object.fromEntries(lanes.map((lane) => [lane.key, nodes.filter((node) => getFolder(node) === lane.key)]));
        const maxNodes = Math.max(1, ...lanes.map((lane) => grouped[lane.key].length));
        const spacing = (height - rowTop - rowBottom) / maxNodes;
        const cardHeight = Math.min(48, Math.max(22, spacing * .78));
        const labelSize = Math.min(14, Math.max(8, laneWidth / 24));
        const pathSize = Math.max(8, labelSize - 3);
        const positions = new Map();
        const shapes = [];

        for (const [laneIndex, lane] of lanes.entries()) {
          const items = grouped[lane.key];
          shapes.push(`<text class="lane-label" x="${lane.x}" y="20" text-anchor="middle"><title>${esc(lane.key)} folder</title>${esc(lane.label)}</text>`);
          items.forEach((node, index) => {
            const y = rowTop + spacing * (index + (maxNodes - items.length) / 2 + .5);
            positions.set(node.id, { x: lane.x, y, color: palette[laneIndex % palette.length] });
          });
        }

        const lines = edges.map((edge) => {
          const from = positions.get(edge.source);
          const to = positions.get(edge.target);
          if (!from || !to) return "";
          let path;
          if (from.x === to.x) {
            const direction = to.y > from.y ? 1 : -1;
            const offset = Math.min(42, Math.abs(to.y - from.y) / 3);
            path = `M ${from.x} ${from.y + direction * cardHeight / 2} C ${from.x + offset} ${from.y + direction * offset}, ${to.x + offset} ${to.y - direction * offset}, ${to.x} ${to.y - direction * cardHeight / 2}`;
          } else {
            const direction = to.x > from.x ? 1 : -1;
            const startX = from.x + direction * cardWidth / 2;
            const endX = to.x - direction * cardWidth / 2;
            const bend = Math.max(28, Math.abs(endX - startX) * .42);
            path = `M ${startX} ${from.y} C ${startX + bend * direction} ${from.y}, ${endX - bend * direction} ${to.y}, ${endX} ${to.y}`;
          }
          const active = selectedNode && (edge.source === selectedNode || edge.target === selectedNode);
          const muted = selectedNode && !active;
          return `<path class="edge ${edge.kind === "API" ? "api" : ""} ${active ? "is-active" : ""} ${muted ? "is-muted" : ""}" d="${path}"><title>${esc(edge.kind)}: ${esc(edge.source)} → ${esc(edge.target)}</title></path>`;
        }).join("");

        for (const node of nodes) {
          const point = positions.get(node.id);
          if (!point) continue;
          const label = node.label.length > 24 ? `${node.label.slice(0, 21)}…` : node.label;
          const active = selectedNode === node.id;
          const connected = selectedNode && edges.some((edge) =>
            (edge.source === selectedNode && edge.target === node.id) ||
            (edge.target === selectedNode && edge.source === node.id)
          );
          const muted = selectedNode && !active && !connected;
          const pathLabel = node.path.length > 38 ? `…${node.path.slice(-35)}` : node.path;
          const compact = cardHeight < 38;
          const labelY = compact ? point.y + labelSize * .34 : point.y - 2;
          const pathLabelSvg = compact ? "" : `<text class="node-path" x="${point.x - cardWidth / 2 + 27}" y="${point.y + 14}" style="font-size:${pathSize}px">${esc(pathLabel)}</text>`;
          shapes.push(`<g class="node ${active ? "is-active" : ""} ${muted ? "is-muted" : ""}" data-node="${esc(node.id)}" tabindex="0" role="button" aria-label="Select ${esc(node.path)}"><title>${esc(node.path)} · ${node.extension}</title><rect class="node-box" x="${point.x - cardWidth / 2}" y="${point.y - cardHeight / 2}" width="${cardWidth}" height="${cardHeight}" rx="9"></rect><circle class="node-dot" cx="${point.x - cardWidth / 2 + 14}" cy="${point.y}" r="4" style="fill:${point.color};filter:drop-shadow(0 0 4px ${point.color})"></circle><text class="node-label" x="${point.x - cardWidth / 2 + 25}" y="${labelY}" style="font-size:${labelSize}px">${esc(label)}</text>${pathLabelSvg}</g>`);
        }

        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("preserveAspectRatio", "none");
        svg.style.width = `${width}px`;
        svg.innerHTML = `<defs><filter id="node-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter></defs>${lines}${shapes.join("")}`;
        $("graph-hint").textContent = `${nodes.length} files · ${edges.length} connections${omitted ? ` · ${omitted} more files not drawn` : ""}${selectedNode ? ` · selected ${selectedNode}` : ""}`;
        svg.querySelectorAll(".node").forEach((element) => {
          const select = () => {
            selectedNode = selectedNode === element.dataset.node ? null : element.dataset.node;
            renderGraph(nodes, edges, omitted);
          };
          element.addEventListener("click", select);
          element.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              select();
            }
          });
        });
      }

      async function refresh() {
        try {
          const response = await fetch("/api/snapshot", { cache: "no-store" });
          if (!response.ok) throw new Error(`Watcher returned HTTP ${response.status}`);
          const data = await response.json();
          if (data.error) throw new Error(data.error);
          $("graph-summary").textContent = `Live · rescanning every 4 seconds`;
          $("hud-status").classList.remove("offline");
          latestGraph = data;
          renderGraph(data.nodes, data.edges, data.omittedNodes);
        } catch (error) {
          $("graph-summary").textContent = `Watcher error · ${error.message}`;
          $("hud-status").classList.add("offline");
        }
      }

      const updateClock = () => {
        $("hud-clock").textContent = new Date().toLocaleTimeString([], { hour12: false });
      };
      updateClock();
      setInterval(updateClock, 1000);
      refresh();
      window.addEventListener("resize", () => {
        if (latestGraph) renderGraph(latestGraph.nodes, latestGraph.edges, latestGraph.omittedNodes);
      });
      setInterval(refresh, 4000);
    </script>
  </body>
</html>
